name: Refresh yt-dlp and publish Windows installer

on:
  push:
    branches: [main, master]
    paths:
      - 'yt_playlist_downloader.py'
      - 'runtime_tools.py'
      - 'scripts/**'
      - 'installer.iss'
      - 'requirements*.txt'
      - 'app_version.txt'
      - 'build_config.json'
      - 'dependency_versions.json'
      - 'assets/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/refresh-and-release.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build and publish a new app release even if upstream dependencies did not change'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: youtube-downloader-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FORCE_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Check upstream dependency versions
        id: upstream
        shell: pwsh
        run: python scripts/check_upstream.py

      - name: Commit dependency and version refresh
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.txt dependency_versions.json build_config.json requirements.txt
          git commit -m "chore: refresh bundled dependencies to v$(Get-Content app_version.txt)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Install Inno Setup
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Python build requirements
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements-build.txt

      - name: Build the app and setup wizard
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_windows.py --skip-install

      - name: Create SHA-256 checksum
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "Output\YouTubeDownloader-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  YouTubeDownloader-Setup.exe" | Out-File -Encoding ascii "Output\SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: steps.upstream.outputs.updated == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content app_version.txt).Trim()
          $reason = "Automated refresh of yt-dlp. FFmpeg and Deno refresh automatically inside the installed app."
          gh release create "v$version" `
            "Output\YouTubeDownloader-Setup.exe" `
            "Output\SHA256SUMS.txt" `
            --title "YouTube Downloader Pro v$version" `
            --notes $reason

      - name: Report that dependencies are current
        if: steps.upstream.outputs.updated != 'true'
        run: echo "No yt-dlp update detected. Installed apps keep checking runtime tools automatically."
